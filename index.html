<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<title>Орбита</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{--fg:#eaf6ff;--dim:rgba(220,235,255,.6);--gold:#ffd75a}
  html,body{margin:0;height:100%;background:#05060f;overflow:hidden;touch-action:none;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
    font-family:'Unbounded',system-ui,sans-serif;color:var(--fg)}
  #c{display:block;position:fixed;inset:0;width:100vw;height:100vh;cursor:pointer}
  .hidden{display:none!important}
  @keyframes blink{50%{opacity:.35}}

  /* ---------- HUD ---------- */
  #hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;
    padding:14px 16px;pointer-events:none;font-weight:700;text-shadow:0 0 12px rgba(120,200,255,.6)}
  #hud .big{font-size:26px;font-weight:900}
  #hud .lbl{font-size:10px;opacity:.6;letter-spacing:.2em;text-transform:uppercase;margin-top:2px}
  #hud .hr{display:flex;gap:12px;align-items:flex-start;text-align:right}
  .hcur{display:flex;gap:12px;justify-content:flex-end;margin-top:6px;font-size:13px}
  .hcur .dl{color:#ffe27a}
  #bPause{pointer-events:auto;width:44px;height:44px;border-radius:12px;border:1px solid rgba(160,200,255,.3);
    background:rgba(255,255,255,.07);color:#fff;font:900 13px Unbounded,sans-serif;cursor:pointer}
  #timer{position:fixed;left:50%;top:8px;transform:translateX(-50%);font-size:36px;font-weight:900;pointer-events:none;
    text-shadow:0 0 16px rgba(120,220,255,.8)}
  #timer.low{color:#ff6b8a;animation:blink .5s infinite;text-shadow:0 0 16px #ff3060}
  #combo{position:fixed;left:50%;top:14px;transform:translateX(-50%);text-align:center;pointer-events:none;opacity:0;transition:opacity .2s}
  body.sprint #combo{top:60px}
  #combo.on{opacity:1}
  #cx{font-size:20px;font-weight:900;color:#ffd75a;text-shadow:0 0 14px rgba(255,200,60,.8);white-space:nowrap}
  #cbar{width:120px;height:4px;margin:6px auto 0;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
  #cbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff8a3c,#ffe06a);border-radius:3px}
  #banner{position:fixed;left:0;right:0;top:28%;text-align:center;pointer-events:none;opacity:0}
  #banner .z{font-size:12px;letter-spacing:.5em;opacity:.7}
  #banner .n{font-size:clamp(22px,5vw,44px);font-weight:900;letter-spacing:.06em;margin-top:8px;text-shadow:0 0 30px currentColor}
  #banner.show{animation:ban 3.2s ease forwards}
  @keyframes ban{0%{opacity:0;transform:translateY(14px) scale(.96)}12%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
  #mute{position:fixed;right:16px;bottom:14px;font-size:10px;letter-spacing:.15em;color:rgba(220,235,255,.35);pointer-events:none}
  #toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);pointer-events:none;opacity:0;text-align:center;
    padding:10px 18px;border-radius:12px;background:rgba(40,30,0,.65);border:1px solid rgba(255,215,90,.5);box-shadow:0 0 30px rgba(255,190,60,.35);max-width:90vw}
  #toast .t1{font-size:10px;letter-spacing:.25em;color:#ffd75a}
  #toast .t2{font-size:13px;font-weight:700;margin-top:4px}
  #toast.show{animation:toast 2.8s ease forwards}
  @keyframes toast{0%{opacity:0;transform:translate(-50%,-10px)}10%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
  .coin{display:inline-block;width:.95em;height:.95em;border-radius:50%;vertical-align:-.13em;
    background:radial-gradient(circle at 35% 35%,#fff7c8,#ffd34a 42%,#d8950f);box-shadow:0 0 8px rgba(255,200,58,.8),inset 0 0 0 2px rgba(255,255,255,.35)}

  /* ---------- panels ---------- */
  #ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:16px}
  .panel{pointer-events:auto;text-align:center;width:100%;max-width:600px;padding:26px 22px;border-radius:22px;box-sizing:border-box;
    max-height:calc(100vh - 32px);overflow-y:auto;touch-action:pan-y;cursor:default;
    background:rgba(6,8,24,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:1px solid rgba(140,190,255,.18);box-shadow:0 0 60px rgba(80,120,255,.15)}
  .panel::-webkit-scrollbar{width:0}
  .panel.wide{max-width:820px}
  .panel.slim{max-width:420px}
  .title{font-size:clamp(42px,10vw,78px);font-weight:900;letter-spacing:.08em;line-height:1;
    background:linear-gradient(180deg,#fff 10%,#8fd8ff 55%,#a77bff);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 18px rgba(120,190,255,.55))}
  .title.small{font-size:clamp(24px,6vw,38px);letter-spacing:.04em}
  .sub{margin-top:12px;font-size:13px;letter-spacing:.12em;color:#bfe6ff}
  .wallet{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 20px;margin-top:16px;font-size:12px;letter-spacing:.1em;color:var(--dim)}
  .wallet b{color:#fff;font-size:17px}
  .wallet .dust,.wallet .dust b{color:#ffe27a}
  .wallet .coins b{color:#ffd34a}
  .rankbar{display:inline-flex;gap:3px;margin-left:8px;vertical-align:middle}
  .rankbar i{width:14px;height:5px;border-radius:3px;background:rgba(255,255,255,.15)}
  .rankbar i.on{background:#8fd8ff;box-shadow:0 0 6px #8fd8ff}
  .modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
  .mode{font:inherit;color:#fff;cursor:pointer;padding:12px 6px 10px;border-radius:14px;background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.1);transition:transform .08s}
  .mode:active{transform:scale(.96)}
  .mode.on{border-color:#8fd8ff;background:rgba(120,190,255,.12);box-shadow:0 0 18px rgba(120,190,255,.35)}
  .mode.locked{opacity:.45}
  .mode .mi{font-size:22px;font-weight:900;height:28px;line-height:28px}
  .mode .mn{font-size:12px;font-weight:900;margin-top:4px}
  .mode .md{font-size:9px;color:var(--dim);margin-top:5px;line-height:1.4}
  .mode .mb{font-size:9px;color:#ffe27a;margin-top:5px;min-height:11px}
  .btns{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
  .btn{font:inherit;font-weight:900;font-size:14px;letter-spacing:.12em;color:#fff;cursor:pointer;padding:14px 24px;border-radius:14px;
    background:rgba(255,255,255,.06);border:1px solid rgba(160,200,255,.3);transition:transform .08s,background .15s;position:relative}
  .btn:hover{background:rgba(255,255,255,.12)}
  .btn:active{transform:scale(.96)}
  .btn.primary{background:linear-gradient(180deg,#5ab8ff,#6a5cff);border-color:transparent;box-shadow:0 0 24px rgba(100,140,255,.55)}
  .btn.big{font-size:20px;padding:18px 64px;border-radius:18px}
  .btn.xs{padding:8px 10px;font-size:10px;letter-spacing:.04em;border-radius:9px;min-width:78px}
  .btn.wide{width:100%}
  .btn.buy{background:linear-gradient(180deg,#ffd75a,#ff9a3c);color:#2a1400;border-color:transparent}
  .btn.buy.coinbuy{background:linear-gradient(180deg,#fff0a0,#ffc02a);box-shadow:0 0 14px rgba(255,200,40,.5)}
  .btn.poor{opacity:.4;cursor:not-allowed}
  .btn.max{background:transparent;color:var(--dim);cursor:default}
  .btn.sel{background:transparent;border-color:#8fd8ff;color:#8fd8ff;cursor:default}
  .dot{position:absolute;top:-5px;right:-5px;width:13px;height:13px;border-radius:50%;background:#ffd75a;box-shadow:0 0 10px #ffb020;animation:blink .9s infinite}
  .goal{margin:16px auto 0;max-width:420px;font-size:11px;color:var(--dim);letter-spacing:.04em;line-height:1.5}
  .goal b{color:#fff}
  .goal.ready{color:#ffd75a;font-weight:700;animation:blink 1.2s infinite}
  .gbar{height:5px;border-radius:3px;background:rgba(255,255,255,.1);margin-top:6px;overflow:hidden}
  .gbar i{display:block;height:100%;background:linear-gradient(90deg,#ffd75a,#ff9a3c)}
  .ms{margin:14px auto 0;max-width:440px;text-align:left}
  .ms .mh{font-size:10px;letter-spacing:.3em;color:var(--dim);text-align:center;margin-bottom:4px}
  .mrow{display:flex;align-items:center;gap:10px;padding:7px 10px;margin-top:6px;border-radius:10px;background:rgba(255,255,255,.04);font-size:11px;line-height:1.3}
  .mrow .mt{flex:1}
  .mrow .mp{font-size:10px;color:var(--dim);white-space:nowrap}
  .mrow .mr{font-size:10px;color:#ffe27a;white-space:nowrap}
  .mrow .bar{height:3px;border-radius:2px;background:rgba(255,255,255,.1);margin-top:5px;overflow:hidden}
  .mrow .bar i{display:block;height:100%;background:#8fd8ff}
  .mrow.done{background:rgba(255,215,90,.12);box-shadow:inset 0 0 0 1px rgba(255,215,90,.35)}
  .mrow.done .bar i{background:#ffd75a}
  .mrow .ic{width:16px;text-align:center;font-weight:900;color:#8fd8ff}
  .mrow.done .ic{color:#ffd75a}
  .keys{margin-top:14px;font-size:9px;letter-spacing:.1em;color:rgba(220,235,255,.35)}
  .rec{margin-top:12px;font-size:10px;letter-spacing:.12em;color:var(--dim)}
  .tag{display:inline-block;margin-top:10px;font-size:10px;letter-spacing:.25em;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.08);color:var(--dim)}
  .stats{display:flex;justify-content:center;gap:24px;margin-top:18px}
  .stats b{display:block;font-size:28px;font-weight:900}
  .stats span{font-size:9px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
  .newrec{margin-top:12px;font-weight:900;color:#ffd75a;letter-spacing:.2em;text-shadow:0 0 16px #ffb020;animation:blink .7s infinite}
  .earn{margin-top:14px;font-size:24px;font-weight:900;color:#ffe27a;text-shadow:0 0 18px rgba(255,200,60,.7)}
  .earnd{font-size:10px;letter-spacing:.06em;color:var(--dim);margin-top:4px}

  /* ---------- shop ---------- */
  .shophead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .shophead .wallet{margin:0}
  .tabs{display:flex;gap:8px;margin:16px 0 14px}
  .tab{flex:1;font:inherit;font-size:11px;font-weight:700;letter-spacing:.18em;color:var(--dim);background:transparent;border:0;
    border-bottom:2px solid rgba(255,255,255,.1);padding:10px;cursor:pointer;position:relative}
  .tab.on{color:#fff;border-color:#8fd8ff}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;text-align:left}
  .card{padding:14px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);display:flex;flex-direction:column;gap:10px}
  .card.ball{border-color:var(--rc);box-shadow:inset 0 0 26px -12px var(--rc)}
  .card.r3{animation:leg 2.4s ease-in-out infinite}
  @keyframes leg{50%{box-shadow:inset 0 0 34px -8px var(--rc),0 0 16px -4px var(--rc)}}
  .card.sel{outline:2px solid #8fd8ff;outline-offset:2px}
  .bhead{display:flex;gap:12px;align-items:center}
  .pv{width:72px;height:72px;flex:none}
  .cn{font-size:14px;font-weight:900}
  .rar{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--rc);margin-top:5px;font-weight:700}
  .cd{font-size:10px;line-height:1.5;color:var(--dim)}
  .st{display:flex;gap:10px;align-items:center}
  .sti{flex:1;min-width:0}
  .stn{font-size:10px;font-weight:700;display:flex;justify-content:space-between;gap:6px}
  .stn span{color:#8fd8ff;font-weight:400;font-size:9px;white-space:nowrap}
  .pips{display:flex;gap:3px;margin-top:5px}
  .pips i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.12)}
  .pips i.on{background:linear-gradient(90deg,#5ab8ff,#a77bff);box-shadow:0 0 6px rgba(120,160,255,.8)}
  .tpv{height:78px;border-radius:12px;position:relative;overflow:hidden}
  .tpv i{position:absolute;border-radius:50%;background:#fff;opacity:.7}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div><div class="big" id="hH">0 м</div><div class="lbl">высота</div></div>
  <div class="hr">
    <div><div class="big" id="hS">0</div><div class="lbl">очки</div>
      <div class="hcur"><span class="dl" id="hD">✦ 0</span><span><i class="coin"></i> <b id="hC">0</b></span></div></div>
    <button id="bPause" aria-label="Пауза">II</button>
  </div>
</div>
<div id="timer" class="hidden">60</div>
<div id="combo"><div id="cx">ЦЕПЬ 2</div><div id="cbar"><i id="cbi"></i></div></div>
<div id="banner"><div class="z" id="bz">ЗОНА 2</div><div class="n" id="bn">—</div></div>
<div id="toast"><div class="t1" id="tt1"></div><div class="t2" id="tt2"></div></div>
<div id="mute"></div>

<div id="ov">
  <div id="menu" class="panel">
    <div class="title">ОРБИТА</div>
    <div class="sub">зажми — цепляйся · отпусти — лети</div>
    <div class="wallet">
      <span class="dust">✦ <b class="dustv">0</b></span>
      <span class="coins"><i class="coin"></i> <b class="coinv">0</b></span>
      <span>РАНГ <b class="rankv">1</b><span class="rankbar"></span></span>
    </div>
    <div class="modes" id="modes"></div>
    <div class="btns"><button class="btn primary big" id="bPlay">ИГРАТЬ</button></div>
    <div class="btns">
      <button class="btn" id="bBalls">ШАРИКИ<span class="dot dballs hidden"></span></button>
      <button class="btn" id="bThemes">ФОНЫ<span class="dot dthemes hidden"></span></button>
    </div>
    <div class="goal" id="goal1"></div>
    <div class="ms" id="ms1"></div>
    <div class="keys">мышь · пробел · тап &nbsp;|&nbsp; M — звук &nbsp;|&nbsp; P — пауза</div>
  </div>

  <div id="over" class="panel hidden">
    <div class="title small" id="dmsg">ПОГЛОЩЁН</div>
    <div class="tag" id="otag"></div>
    <div class="stats">
      <div><b id="sS">0</b><span>очки</span></div>
      <div><b id="sH">0</b><span>метров</span></div>
      <div><b id="sC">0</b><span>макс. цепь</span></div>
    </div>
    <div class="newrec hidden" id="newrec">НОВЫЙ РЕКОРД</div>
    <div class="earn" id="earn"></div>
    <div class="earnd" id="earnd"></div>
    <div class="btns">
      <button class="btn primary" id="bAgain">ЕЩЁ РАЗ</button>
      <button class="btn" id="bShop2">ШАРИКИ<span class="dot dballs hidden"></span></button>
      <button class="btn" id="bMenu">МЕНЮ</button>
    </div>
    <div class="goal" id="goal2"></div>
    <div class="ms" id="ms2"></div>
    <div class="rec" id="rec2"></div>
  </div>

  <div id="shop" class="panel wide hidden">
    <div class="shophead">
      <div class="title small">МАГАЗИН</div>
      <div class="wallet"><span class="dust">✦ <b class="dustv">0</b></span><span class="coins"><i class="coin"></i> <b class="coinv">0</b></span></div>
    </div>
    <div class="tabs">
      <button class="tab" data-tab="balls">ШАРИКИ<span class="dot dballs hidden"></span></button>
      <button class="tab" data-tab="themes">ФОНЫ<span class="dot dthemes hidden"></span></button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="btns"><button class="btn" id="bBack">НАЗАД</button></div>
  </div>

  <div id="pausep" class="panel slim hidden">
    <div class="title small">ПАУЗА</div>
    <div class="btns"><button class="btn primary" id="bResume">ПРОДОЛЖИТЬ</button><button class="btn" id="bQuit">ЗАВЕРШИТЬ</button></div>
  </div>
</div>

<script>
'use strict';
// =====================================================================
//  CONSTANTS & DATA
// =====================================================================
const TAU = Math.PI * 2;
const W = 720;                 // logical playfield width
const GRAB = 210, G = 620, ORBIT_ACC = 230, MAXSPD = 1050, MAXFREE = 1500;
const COMBO_TIME = 3.2, CRUMBLE_T = 1.25, BIOME_LEN = 400, SPRINT_TIME = 60;
const BALL_R = 11;

const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

const COL = {
  normal: [110, 200, 255], boost: [255, 205, 70], crumble: [255, 120, 60], moving: [180, 140, 255],
  mine: [255, 45, 85], white: [255, 255, 255], gold: [255, 215, 90], clock: [90, 230, 255], meteor: [255, 120, 40],
};

const THEMES = [
  { id: 'space', name: 'Космос', cost: 0, style: 'stars', desc: 'Звёзды и туманности', zones: [
    { name: 'Глубокий космос',    bg1: [5, 6, 18],  bg2: [16, 14, 46], neb: [70, 60, 210],  neb2: [20, 120, 210], voidc: [150, 50, 255], orb: [120, 230, 255] },
    { name: 'Розовая туманность', bg1: [16, 4, 20], bg2: [54, 10, 48], neb: [255, 60, 160], neb2: [140, 40, 255], voidc: [255, 40, 130], orb: [255, 160, 225] },
    { name: 'Изумрудный пояс',    bg1: [2, 14, 16], bg2: [6, 38, 36],  neb: [30, 220, 150], neb2: [20, 140, 220], voidc: [40, 255, 170], orb: [160, 255, 205] },
    { name: 'Солнечный ветер',    bg1: [18, 8, 4],  bg2: [56, 22, 8],  neb: [255, 140, 40], neb2: [255, 60, 40],  voidc: [255, 110, 30], orb: [255, 225, 130] },
    { name: 'Горизонт событий',   bg1: [2, 2, 4],   bg2: [22, 8, 14],  neb: [255, 40, 60],  neb2: [180, 180, 255], voidc: [255, 255, 255], orb: [255, 255, 255] },
  ]},
  { id: 'ocean', name: 'Глубины', cost: 10, style: 'bubbles', desc: 'Пузыри и морская бездна', zones: [
    { name: 'Лагуна',          bg1: [2, 18, 36], bg2: [6, 52, 90],  neb: [40, 200, 255], neb2: [20, 120, 200], voidc: [60, 255, 220], orb: [170, 255, 240] },
    { name: 'Коралловый риф',  bg1: [18, 8, 36], bg2: [52, 26, 80], neb: [255, 120, 160], neb2: [80, 200, 255], voidc: [255, 90, 150], orb: [255, 200, 220] },
    { name: 'Бездна',          bg1: [1, 4, 12],  bg2: [4, 16, 40],  neb: [40, 80, 255],  neb2: [100, 40, 255], voidc: [120, 90, 255], orb: [150, 200, 255] },
  ]},
  { id: 'candy', name: 'Сладкий мир', cost: 20, style: 'candy', desc: 'Посыпка, зефир и карамель', zones: [
    { name: 'Зефирные облака',   bg1: [44, 20, 60], bg2: [110, 56, 124], neb: [255, 170, 220], neb2: [170, 200, 255], voidc: [255, 120, 200], orb: [255, 240, 160] },
    { name: 'Мятная долина',     bg1: [14, 46, 54], bg2: [40, 104, 104], neb: [150, 255, 220], neb2: [255, 200, 230], voidc: [100, 255, 200], orb: [255, 255, 255] },
    { name: 'Карамельный закат', bg1: [54, 22, 16], bg2: [124, 58, 44],  neb: [255, 190, 120], neb2: [255, 120, 170], voidc: [255, 150, 80],  orb: [255, 250, 200] },
  ]},
  { id: 'synth', name: 'Синтвейв', cost: 35, style: 'grid', desc: 'Неоновое солнце и ретро-сетка', zones: [
    { name: 'Неоновое шоссе', bg1: [10, 2, 30], bg2: [50, 10, 80],  neb: [255, 40, 200], neb2: [40, 200, 255], voidc: [255, 40, 200], orb: [80, 240, 255] },
    { name: 'Ретро-закат',    bg1: [30, 4, 40], bg2: [100, 18, 84], neb: [255, 120, 60], neb2: [255, 40, 160], voidc: [255, 140, 40], orb: [255, 230, 120] },
    { name: 'Киберночь',      bg1: [2, 4, 20],  bg2: [10, 20, 60],  neb: [60, 255, 200], neb2: [160, 60, 255], voidc: [60, 255, 180], orb: [200, 255, 240] },
  ]},

function initAudio() {
  if (AC) { if (AC.state === 'suspended' && !paused) AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();

    const d = AC.createDelay(1); d.delayTime.value = 0.29;
    const fb = AC.createGain(); fb.gain.value = 0.4;
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
    const wet = AC.createGain(); wet.gain.value = 0.4;
    send = AC.createGain();
    send.connect(d); d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(wet); wet.connect(master);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const ch = noiseBuf.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
    droneGain = AC.createGain(); droneGain.gain.value = 0;
    const dl = AC.createBiquadFilter(); dl.type = 'lowpass'; dl.frequency.value = 400;
    droneGain.connect(dl); dl.connect(master);
    [55, 82.41, 110.3].forEach((f, i) => {
      const o = AC.createOscillator(); o.type = i === 2 ? 'triangle' : 'sine'; o.frequency.value = f;
      const g = AC.createGain(); g.gain.value = i === 2 ? 0.15 : 0.5;
      const lfo = AC.createOscillator(); lfo.frequency.value = 0.07 + i * 0.05;
      const lg = AC.createGain(); lg.gain.value = 0.3; lfo.connect(lg); lg.connect(g.gain); lfo.start();
      o.connect(g); g.connect(droneGain); o.start();

}

  if (!AC || voices > 22) return;

  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  o.onended = () => { voices--; };
  o.start(t); o.stop(t + dur + 0.05);
}

  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = q;
  f.frequency.setValueAtTime(f1, t); f.frequency.exponentialRampToValueAtTime(f2, t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

const SAVE_KEY = 'orbita_save';

function defaultSave() {
  return { v: 2, dust: 0, coins: 0, balls: { spark: newBallSave() }, ball: 'spark', themes: ['space'], theme: 'space',
    mode: 'classic', missions: [], mdone: 0, totals: { orbs: 0, runs: 0, coins: 0 }, refund: 0 };
}
function migrateSave(s) {
  const n = defaultSave();
  if (!s || typeof s !== 'object') return n;
  if (!s.v) {
    // v1 had global upgrades and colour skins — refund everything as dust
    const OLD_UP = { rope: [40, 110, 240, 450, 800], engine: [50, 130, 280, 500, 850], magnet: [60, 160, 340, 620],
      chain: [70, 180, 380, 700], dust: [80, 200, 400, 700, 1100], shield: [500], rescue: [900] };
    const OLD_SKIN = { fire: 150, toxic: 300, neon: 500, ice: 750, gold: 1200, rainbow: 2500 };
    let refund = 0;
    for (const k in (s.up || {})) for (let i = 0; i < s.up[k]; i++) refund += (OLD_UP[k] || [])[i] || 0;
    for (const k of (s.skins || [])) refund += OLD_SKIN[k] || 0;
    n.dust = (s.dust | 0) + refund; n.refund = refund;
    n.missions = Array.isArray(s.missions) ? s.missions : [];
    n.mdone = s.mdone | 0;
    Object.assign(n.totals, s.totals || {});
  } else {
    Object.assign(n, s);
    n.totals = Object.assign({ orbs: 0, runs: 0, coins: 0 }, s.totals || {});
    n.balls = Object.assign({ spark: newBallSave() }, s.balls || {});
    n.themes = Array.isArray(s.themes) && s.themes.length ? s.themes : ['space'];
  }
  if (!BALLS.some(b => b.id === n.ball) || !n.balls[n.ball]) n.ball = 'spark';
  if (!THEMES.some(t => t.id === n.theme) || !n.themes.includes(n.theme)) n.theme = 'space';
  if (!MODES.some(m => m.id === n.mode)) n.mode = 'classic';
  n.missions = (n.missions || []).filter(m => m && MT[m.type]);

}

  let x = genX + dx;

  }
  if (h > 80 && Math.random() < 0.05 && !orbs.some(o => o.kind === 'shield' && !o.dead)) {
    orbs.push({ kind: 'shield', s, a: rand(0, TAU), R: 125, x: 0, y: 0, ph: 0, dead: false });
  }

  // mines (none in sprint — that mode is for relaxed play)
  let ringMine = null;
  if (mode !== 'sprint' && h > 120) {
    const pm = Math.min(0.6, 0.12 + diff * 0.55);
    if (Math.random() < pm) {
      if (Math.random() < 0.5 && type !== 'crumble') {
        ringMine = { kind: 'orbit', s, R: rand(172, 200), a: rand(0, TAU), w: rand(0.7, 1.3) * (Math.random() < 0.5 ? -1 : 1) * (1 + diff * 0.5),
          r: 13, x: 0, y: 0, rot: 0, ph: rand(0, TAU), near: false, done: false, dead: false };
        mines.push(ringMine);
      } else if (genPrev) {
        mines.push({ kind: 'drift', bx: clamp((genPrev.bx + s.bx) / 2 + rand(-130, 130), 60, W - 60), by: (genPrev.y + y) / 2,
          amp: rand(40, 150), ms: rand(0.5, 1.2) * (1 + diff * 0.5), r: 13, x: 0, y: 0, rot: 0, ph: rand(0, TAU), near: false, done: false, dead: false });
      }
    }
  }

  // coins: rare, and always in a spot that needs a bit of courage
  // sprint can't be lost, so it gets fewer coins — otherwise it becomes a coin farm
  const coinP = mode === 'storm' ? 0.26 : mode === 'sprint' ? 0.05 : 0.13;
  if (h > 30 && Math.random() < coinP) placeCoin(s, ringMine);

  // sprint: clocks give extra time
  if (mode === 'sprint' && h > 20 && Math.random() < 0.22) orbs.push({ kind: 'clock', s, a: rand(0, TAU), R: 115, x: 0, y: 0, ph: 0, dead: false });

  genPrev = s; genX = s.bx; genY = y;
}
function placeCoin(s, ringMine) {
  const r = Math.random();
  if (ringMine && r < 0.65) {
    // rides the mine's orbit on the opposite side — you have to time the pass
    orbs.push({ kind: 'coin', s, a: ringMine.a + Math.PI, R: ringMine.R, spin: ringMine.w, x: 0, y: 0, ph: rand(0, TAU), dead: false });
  } else if (r < 0.55 && genPrev) {
    const side = Math.random() < 0.5 ? -1 : 1;
    orbs.push({ kind: 'coin', s: null, x: clamp((genPrev.bx + s.bx) / 2 + side * rand(110, 170), 40, W - 40), y: (genPrev.y + s.y) / 2, ph: rand(0, TAU), dead: false });
  } else {
    orbs.push({ kind: 'coin', s: null, x: clamp(s.bx + rand(-50, 50), 40, W - 40), y: s.y - rand(160, 210), ph: rand(0, TAU), dead: false });
  }
}

function addPart(x, y, vx, vy, life, c, size) {
  if (parts.length >= PCAP()) return;
  parts.push({ x, y, vx, vy, life, max: life, c, size });
}
function burst(x, y, c, n, sp = 260, life = 0.8, size = 10) {
  if (Q === 0) n = Math.ceil(n / 2);
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), v = sp * rand(0.15, 1);
    addPart(x, y, Math.cos(a) * v, Math.sin(a) * v, life * rand(0.5, 1), c, size * rand(0.6, 1.3));
  }
}
function ring(x, y, c, n, sp) {
  if (Q === 0) n = Math.ceil(n / 2);
  for (let i = 0; i < n; i++) { const a = i / n * TAU; addPart(x, y, Math.cos(a) * sp, Math.sin(a) * sp, 0.7, c, 9); }
}
function pop(x, y, text, c, size = 20, life = 1) { if (pops.length < 30) pops.push({ x, y, text, c, size, life, max: life }); }

// =====================================================================
//  CORE MECHANICS
// =====================================================================
function findTarget() {
  let bestS = null, bd = K.grab;
  for (let i = 0; i < stars.length; i++) {
    const s = stars[i];
    if (s.dead) continue;
    if (s === lastStar && time - releaseT < 0.3) continue;
    const d = Math.hypot(P.x - s.x, P.y - s.y);
    if (d < bd) { bd = d; bestS = s; }
  }
  return bestS;
}

function attach(s) {
  const dx = P.x - s.x, dy = P.y - s.y;
  const d = Math.hypot(dx, dy) || 1;
  P.att = s; P.L = Math.max(d, 50); P.ang = Math.atan2(dy, dx);
  const cross = dx * P.vy - dy * P.vx;
  if (Math.abs(cross) < 1e-3 * d) P.dir = Math.cos(P.ang) > 0 ? -1 : 1;
  else P.dir = cross > 0 ? 1 : -1;
  P.spd = clamp(Math.hypot(P.vx, P.vy) * 0.95, 380, MAXSPD);
  s.attT = 0; gravityOn = true; grabs++; lastAttachY = s.y;
  if (!s.visited) {
    s.visited = true;
    if (s.type === 'crumble') R.crumble++;
    combo++; comboT = K.chain;
    if (combo > bestCombo) bestCombo = combo;
    const pts = 10 * mult();
    bonus += pts;
    pop(s.x, s.y - 34, '+' + pts, COL.gold, 16 + Math.min(combo, 12), 0.9);
    const f = note(Math.min(combo, 22) + 4, 220);
    tone(f, 0.55, 'triangle', 0.17); tone(f * 2, 0.3, 'sine', 0.05);
    if (combo % 5 === 0) {
      pop(s.x, s.y - 70, 'ЦЕПЬ ' + combo + '!', COL.gold, 30, 1.4);
      ring(s.x, s.y, COL.gold, 28, 420);
      [0, 2, 4, 7].forEach((k, i) => tone(note(10 + k, 220), 0.9, 'sine', 0.08, i * 0.06));
      shake = Math.max(shake, 6); happy(1.2);
    }
  } else tone(note(2, 220), 0.25, 'triangle', 0.07);
  burst(P.x, P.y, COL[s.type], 10, 160, 0.4, 7);
}

function release() {
  const s = P.att; P.att = null; lastStar = s; releaseT = time;
  P.vx = -Math.sin(P.ang) * P.dir * P.spd; P.vy = Math.cos(P.ang) * P.dir * P.spd;
  if (s && s.type === 'boost' && !s.dead) {
    P.vx *= 1.45; P.vy *= 1.45; warpT = 0.7; R.boost++;
    burst(P.x, P.y, COL.boost, 26, 320, 0.6, 10);
    tone(200, 0.5, 'sawtooth', 0.05, 0, 900); noise(0.4, 0.12, 600, 4000);
    shake = Math.max(shake, 5);
  } else noise(0.22, 0.05 + P.spd / 25000, 700, 2600);
}

function breakStar(s) {
  s.dead = true;
  burst(s.x, s.y, COL.crumble, 40, 300, 0.9, 11);
  burst(s.x, s.y, COL.white, 12, 200, 0.5, 6);
  noise(0.45, 0.22, 900, 120, 0.8); tone(110, 0.35, 'square', 0.04, 0, 50);
  shake = Math.max(shake, 7);
  if (P.att === s) release();
}

// returns true if the ball survives touching a mine / meteor
function hazardHit(o) {
  if (P.inv > 0) return true;
  if (K.eat && P.eatCD <= 0) {
    P.eatCD = K.eat; o.dead = true;
    burst(o.x, o.y, COL.mine, 30, 300, 0.7, 10); ring(P.x, P.y, [190, 120, 255], 24, 360);
    pop(P.x, P.y - 40, 'НЯМ!', [210, 160, 255], 26, 1.2);
    bonus += 30 * mult();
    tone(note(3, 110), 0.5, 'sine', 0.16, 0, 40); noise(0.3, 0.12, 300, 80);
    shake = 8; happy(1.5);
    return true;
  }
  if (K.phase && P.phaseCD <= 0) {
    P.phaseCD = K.phase; P.inv = 0.8;
    pop(P.x, P.y - 40, 'СКВОЗЬ!', [225, 215, 255], 22, 1.1);
    tone(note(14), 0.6, 'sine', 0.09, 0, note(4)); happy(1);
    return true;
  }
  if (P.shield) {
    P.shield = false; P.inv = 1; o.dead = true;
    burst(o.x, o.y, COL.mine, 40, 340, 0.8, 11); ring(P.x, P.y, COL.white, 30, 380);
    noise(0.5, 0.25, 2000, 200); tone(note(15), 0.5, 'sine', 0.1);
    flash = 0.5; shake = 10; pop(P.x, P.y - 40, 'ЩИТ СПАС!', COL.white, 22, 1.2);
    return true;
  }
  return false;
}

function die(cause) {
  if (state !== 'play') return;
  state = 'dying'; dyingT = 1.2; deathCause = cause; P.dead = true; P.att = null; holding = false;
  burst(P.x, P.y, COL.white, 60, 520, 1.2, 12);

  shake = 22; flash = 1;

  if (droneGain) droneGain.gain.setTargetAtTime(0.015, AC.currentTime, 0.3);
}
function endTime() {
  state = 'dying'; dyingT = 1.4; deathCause = 'time'; holding = false;
  for (let i = 0; i < 4; i++) ring(P.x + rand(-140, 140), P.y + rand(-160, 40), rainbowCols[i * 6], 24, 300);

}
function quitRun() {

}

function rescue() {
  rescueLeft--;
  if (P.att) release();
  P.vy = -1150; P.vx *= 0.4; voidY = P.y + 260; P.inv = 1.2;
  flash = 0.6; shake = 14; warpT = 0.8;
  pop(P.x, P.y - 40, 'КАТАПУЛЬТА!', COL.gold, 24, 1.4);
  ring(P.x, P.y, COL.gold, 32, 460);
  tone(160, 0.7, 'sawtooth', 0.07, 0, 1200); noise(0.5, 0.15, 400, 5000);
  happy(1.5);
}
function respawn() {
  // sprint: falling just costs time
  let s = (lastStar && !lastStar.dead) ? lastStar : null;
  if (!s) { let bd = 1e9; for (const t of stars) { if (t.dead) continue; const d = Math.abs(t.y - lastAttachY); if (d < bd) { bd = d; s = t; } } }
  P.att = null; P.vx = 0; P.vy = 0;
  P.x = s ? s.x : W / 2; P.floatY = (s ? s.y : lastAttachY) + 120; P.y = P.floatY;
  gravityOn = false; trN = 0; combo = 0;
  lastAttachY = P.floatY - 120;
  timeLeft = Math.max(0, timeLeft - 3);
  pop(P.x, P.y - 30, '−3 с', [255, 120, 150], 24, 1.2);
  flash = 0.3; tone(note(2), 0.4, 'triangle', 0.08, 0, note(0));
}

function collect(o) {
  o.dead = true;
  if (o.kind === 'shield') {
    P.shield = true;
    ring(o.x, o.y, COL.white, 24, 300);
    [0, 4, 7, 12].forEach((k, i) => tone(note(8 + k, 220), 0.6, 'triangle', 0.08, i * 0.05));
    pop(o.x, o.y - 30, 'ЩИТ', COL.white, 22, 1.2); happy(1);
  } else if (o.kind === 'clock') {

  } else if (o.kind === 'coin') {
    R.coins++; save.coins++; save.totals.coins++; persist();
    ring(o.x, o.y, COL.gold, 22, 320); burst(o.x, o.y, [255, 250, 200], 14, 220, 0.6, 8);
    pop(o.x, o.y - 30, '+1 МОНЕТА', COL.gold, 22, 1.3);
    [15, 17, 20].forEach((k, i) => tone(note(k, 220), 0.5, 'triangle', 0.1, i * 0.06));
    shake = Math.max(shake, 4); happy(1.3);
  } else {
    if (time - lastOrbT > 0.9) orbChain = 0;
    lastOrbT = time; orbChain++; R.orbs++;
    const pts = 5 * mult();
    bonus += pts;
    burst(o.x, o.y, biome().orb, 8, 150, 0.4, 6);
    tone(note(10 + Math.min(orbChain, 14), 220), 0.22, 'sine', 0.09);

// =====================================================================
//  SIMULATION
// =====================================================================
function updateWorld(dt) {
  for (let i = 0; i < stars.length; i++) { const s = stars[i]; if (s.type === 'moving') s.x = s.bx + Math.sin(time * s.ms + s.ph) * s.amp; }
  for (let i = 0; i < mines.length; i++) {
    const m = mines[i];
    m.rot += dt * 2.2;
    if (m.kind === 'orbit') { m.a += m.w * dt; m.x = m.s.x + Math.cos(m.a) * m.R; m.y = m.s.y + Math.sin(m.a) * m.R; }
    else { m.x = m.bx + Math.sin(time * m.ms + m.ph) * m.amp; m.y = m.by; }
  }
  for (let i = 0; i < orbs.length; i++) {
    const o = orbs[i];
    if (o.s) { o.a += (o.spin !== undefined ? o.spin : 0.5) * dt; o.x = o.s.x + Math.cos(o.a) * o.R; o.y = o.s.y + Math.sin(o.a) * o.R; }
  }
}

function step(dt) {
  updateWorld(dt);

  if (P.att && (!holding || P.att.dead)) release();
  if (!P.att && holding) { const t = findTarget(); if (t) attach(t); }

  if (P.att) {
    const s = P.att;
    s.attT += dt;
    P.spd = Math.min(P.spd + ORBIT_ACC * K.acc * dt, MAXSPD);
    const tl = clamp(P.L, 70, 150);
    P.L += (tl - P.L) * Math.min(1, dt * 4);
    P.ang += P.dir * P.spd / P.L * dt;
    P.x = s.x + Math.cos(P.ang) * P.L; P.y = s.y + Math.sin(P.ang) * P.L;
    P.vx = -Math.sin(P.ang) * P.dir * P.spd; P.vy = Math.cos(P.ang) * P.dir * P.spd;
    if (s.type === 'crumble' && s.attT > CRUMBLE_T) breakStar(s);
  } else {
    if (gravityOn) P.vy += G * dt;
    else { P.vx = 0; P.vy = 0; P.y = P.floatY + Math.sin(time * 2.2) * 5; }
    const sp = Math.hypot(P.vx, P.vy);
    if (sp > MAXFREE) { P.vx *= MAXFREE / sp; P.vy *= MAXFREE / sp; }
    P.x += P.vx * dt; P.y += P.vy * dt;
    if (P.x < 10 || P.x > W - 10) {
      P.x = clamp(P.x, 10, W - 10); P.vx = -P.vx * (K.bouncy ? 1.08 : 0.85);
      if (time - lastWallT > 0.15) {
        lastWallT = time;
        burst(P.x, P.y, biome().orb, 12, 200, 0.4, 6);
        tone(note(K.bouncy ? 8 : 1, 440), 0.12, K.bouncy ? 'triangle' : 'square', 0.04);
      }
    }
  }
  if (P.inv > 0) P.inv -= dt;
  if (P.phaseCD > 0) P.phaseCD -= dt;
  if (P.eatCD > 0) P.eatCD -= dt;

  // mines
  for (let i = 0; i < mines.length; i++) {
    const m = mines[i];
    if (m.dead) continue;
    const d = Math.hypot(P.x - m.x, P.y - m.y);
    if (d < m.r + 6) {
      if (!hazardHit(m)) { die('mine'); return; }
      continue;
    }
    if (m.done) continue;
    if (d < m.r + 32) m.near = true;
    else if (m.near && d > m.r + 70) {
      m.near = false; m.done = true;
      const pts = 25 * mult();
      bonus += pts; slowT = 0.35; R.near++;
      pop(P.x, P.y - 36, 'НА ВОЛОСКЕ +' + pts, [255, 120, 150], 18, 1.2);
      tone(note(15), 0.4, 'sine', 0.1); tone(note(17), 0.5, 'sine', 0.08, 0.07);
    }
  }

  // meteors (storm)
  if (mode === 'storm') {
    if (gravityOn) {
      meteorT -= dt;
      if (meteorT <= 0) {
        meteorT = rand(1.3, 2.6) * Math.max(0.45, 1 - maxH / 3500);
        warns.push({ x: rand(50, W - 50), t: 0.9, vx: rand(-120, 120), done: false });
      }
    }
    for (let i = 0; i < warns.length; i++) {
      const w = warns[i];
      if (w.done) continue;
      w.t -= dt;
      if (w.t <= 0) {
        w.done = true;
        meteors.push({ x: w.x, y: camY - 120, vx: w.vx, vy: rand(430, 560) + Math.min(250, maxH * 0.05), r: 15, rot: 0, dead: false, near: false, nd: false });
        tone(90, 0.5, 'sawtooth', 0.04, 0, 40);
      }
    }
    for (let i = 0; i < meteors.length; i++) {
      const m = meteors[i];
      if (m.dead) continue;
      m.x += m.vx * dt; m.y += m.vy * dt; m.rot += dt * 3;
      if (m.x < 15 || m.x > W - 15) m.vx = -m.vx;
      const d = Math.hypot(P.x - m.x, P.y - m.y);
      if (d < m.r + 7) { if (!hazardHit(m)) { die('meteor'); return; } }
      else if (d < m.r + 40) m.near = true;
      else if (m.near && !m.nd && d > m.r + 80) {
        m.nd = true; bonus += 20 * mult(); R.near++;
        pop(P.x, P.y - 36, 'УВЕРНУЛСЯ!', [255, 170, 90], 18, 1.1);
        tone(note(14), 0.35, 'sine', 0.08);
      }
    }
  }

  // pickups (+ magnets)
  const mr = K.magR, cm = K.coinMag;
  for (let i = 0; i < orbs.length; i++) {
    const o = orbs[i];
    if (o.dead) continue;
    let dx = P.x - o.x, dy = P.y - o.y, d = Math.hypot(dx, dy);
    const pull = o.kind === 'orb' ? mr : o.kind === 'coin' ? cm : 0;
    if (pull && d < pull) {
      o.s = null; const k = Math.min(1, dt * 9);
      o.x += dx * k; o.y += dy * k; d = Math.hypot(P.x - o.x, P.y - o.y);
    }
    if (d < (o.kind === 'orb' ? 24 : 30)) collect(o);

const hH = document.getElementById('hH'), hS = document.getElementById('hS'), hD = document.getElementById('hD'), hC = document.getElementById('hC');

const hudCache = { h: -1, s: -1, d: -1, c: -1, combo: -1, on: -1, t: -1, w: -1 };
function updateHud() {

function makeMission(type) {
  const t = tier(), d = MT[type];
  return { type, n: d.n(t), reward: 30 + 15 * t, base: d.cum ? save.totals[d.cum] : 0, done: false };
}
function newMission() {
  const used = save.missions.map(m => m.type);
  const pool = Object.keys(MT).filter(k => !used.includes(k));
  return makeMission(pool[Math.random() * pool.length | 0]);
}
function missionVal(m) {
  const d = MT[m.type], runV = R ? d.run(R) : 0;
  return d.cum ? save.totals[d.cum] - m.base + (R && !R.final ? runV : 0) : runV;
}
function refillMissions() {
  save.missions = save.missions.filter(m => !m.done);
  if (save.mdone === 0 && save.missions.length === 0) save.missions = ['height', 'orbs', 'combo'].map(makeMission);
  while (save.missions.length < 3) save.missions.push(newMission());
  persist();
}
function checkMissions() {
  for (const m of save.missions) {
    if (m.done || missionVal(m) < m.n) continue;
    m.done = true;
    const oldTier = tier();
    save.mdone++; save.dust += m.reward; missionDust += m.reward;
    let t1 = 'ЗАДАНИЕ ВЫПОЛНЕНО  +' + m.reward + ' ✦';
    if (tier() > oldTier) { save.coins += 5; rankCoins += 5; t1 = 'НОВЫЙ РАНГ ' + (tier() + 1) + '!  +' + m.reward + ' ✦  +5 МОНЕТ'; }
    persist();
    toast(t1, MT[m.type].t(m.n));
    [0, 4, 7, 12].forEach((k, i) => tone(note(10 + k, 220), 0.7, 'triangle', 0.08, i * 0.07));
    if (state === 'play' && P) { ring(P.x, P.y, COL.gold, 30, 420); happy(1.5); }
  }
}
function missionsHTML(title) {
  let h = `<div class="mh">${title}</div>`;
  for (const m of save.missions) {
    const v = Math.min(m.n, Math.floor(missionVal(m)));
    const pct = m.done ? 100 : Math.round(v / m.n * 100);
    h += `<div class="mrow${m.done ? ' done' : ''}"><div class="ic">${m.done ? '✓' : '◇'}</div>
      <div class="mt">${MT[m.type].t(m.n)}<div class="bar"><i style="width:${pct}%"></i></div></div>
      <div class="mp">${m.done ? '' : v + '/' + m.n}</div><div class="mr">+${m.reward} ✦</div></div>`;
  }
  return h;
}
const curIcon = cur => cur === 'coin' ? '<i class="coin"></i>' : '✦';
const have = cur => cur === 'coin' ? save.coins : save.dust;
function nextGoal() {
  const c = [];

  for (const t of THEMES) if (!save.themes.includes(t.id)) c.push({ name: 'фон «' + t.name + '»', cur: 'coin', cost: t.cost });
  if (!c.length) return null;
  for (const x of c) { x.p = have(x.cur) / x.cost; x.left = x.cost - have(x.cur); }
  const ready = c.filter(x => x.left <= 0);
  if (ready.length) return ready.sort((a, b) => b.cost - a.cost)[0];
  return c.sort((a, b) => b.p - a.p)[0];
}
function goalHTML() {
  const g = nextGoal();
  if (!g) return '<div class="goal ready">Ты собрал всё! Настоящая легенда.</div>';
  if (g.left <= 0) return `<div class="goal ready">Можно купить: <b>${g.name}</b>!</div>`;
  return `<div class="goal">Следующая цель: <b>${g.name}</b> — ещё ${g.left} ${curIcon(g.cur)}<div class="gbar"><i style="width:${Math.round(g.p * 100)}%"></i></div></div>`;
}
function ballsAffordable() {
  for (const b of BALLS) {
    const own = save.balls[b.id];
    if (!own) { if (have(b.cur) >= b.cost) return true; continue; }
    for (const st of STATS) { const l = own[st.id]; if (l < 5 && save.dust >= upCost(b, l)) return true; }
  }
  return false;
}
const themesAffordable = () => THEMES.some(t => !save.themes.includes(t.id) && save.coins >= t.cost);
function refreshWallet() {
  document.querySelectorAll('.dustv').forEach(e => e.textContent = save.dust);
  document.querySelectorAll('.coinv').forEach(e => e.textContent = save.coins);
  document.querySelectorAll('.rankv').forEach(e => e.textContent = tier() + 1);
  const bars = [0, 1, 2].map(i => `<i${save.mdone % 3 > i ? ' class="on"' : ''}></i>`).join('');
  document.querySelectorAll('.rankbar').forEach(e => e.innerHTML = bars);
  const ba = ballsAffordable(), ta = themesAffordable();
  document.querySelectorAll('.dballs').forEach(e => e.classList.toggle('hidden', !ba));
  document.querySelectorAll('.dthemes').forEach(e => e.classList.toggle('hidden', !ta));
}
function renderModes() {
  let h = '';
  for (const m of MODES) {
    const locked = m.unlockH && best.classic.h < m.unlockH, sel = save.mode === m.id, B = best[m.id];
    h += `<button class="mode${sel ? ' on' : ''}${locked ? ' locked' : ''}" data-mode="${m.id}">
      <div class="mi">${locked ? '🔒' : m.icon}</div><div class="mn">${m.name}</div>
      <div class="md">${locked ? `Открой: ${m.unlockH} м в Классике` : m.desc}</div>
      <div class="mb">${B.score ? 'рекорд ' + B.score : ''}</div></button>`;
  }
  document.getElementById('modes').innerHTML = h;
}
function refreshMenu() {
  renderModes();
  document.getElementById('goal1').innerHTML = goalHTML();
  document.getElementById('ms1').innerHTML = missionsHTML('ЗАДАНИЯ');
  refreshWallet();
}

// =====================================================================
//  SHOP
// =====================================================================
let shopTab = 'balls', shopFrom = 'menu', previews = [];
function renderShop() {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === shopTab));
  let h = '';
  if (shopTab === 'balls') {
    for (const b of BALLS) {
      const own = save.balls[b.id], sel = save.ball === b.id, rr = RARITY[b.rar];
      h += `<div class="card ball r${b.rar}${sel ? ' sel' : ''}" style="--rc:${rr.c}">
        <div class="bhead"><canvas class="pv" data-ball="${b.id}"></canvas>
          <div><div class="cn">${b.name}</div><div class="rar">${rr.name}</div></div></div>
        <div class="cd">${b.perk}</div>`;
      if (own) {
        for (const st of STATS) {
          const l = own[st.id], cost = upCost(b, l);
          let pips = ''; for (let i = 0; i < 5; i++) pips += `<i class="${i < l ? 'on' : ''}"></i>`;
          const btn = l >= 5 ? '<button class="btn xs max">МАКС</button>'
            : `<button class="btn xs buy${save.dust < cost ? ' poor' : ''}" data-bup="${b.id}:${st.id}">${cost} ✦</button>`;
          h += `<div class="st"><div class="sti"><div class="stn">${st.name}<span>${st.val(l, b)}</span></div><div class="pips">${pips}</div></div>${btn}</div>`;
        }
      }
      h += sel ? '<button class="btn xs wide sel">ВЫБРАН</button>'
        : own ? `<button class="btn xs wide" data-ball="${b.id}">ВЫБРАТЬ</button>`
        : `<button class="btn xs wide buy${b.cur === 'coin' ? ' coinbuy' : ''}${have(b.cur) < b.cost ? ' poor' : ''}" data-ball="${b.id}">КУПИТЬ · ${b.cost} ${curIcon(b.cur)}</button>`;
      h += '</div>';
    }
  } else {
    for (const t of THEMES) {
      const own = save.themes.includes(t.id), sel = save.theme === t.id, z = t.zones[0];
      const bg = `radial-gradient(circle at 28% 32%,${rgba(z.neb, .7)},transparent 55%),radial-gradient(circle at 76% 70%,${rgba(z.neb2, .6)},transparent 50%),linear-gradient(180deg,${rgba(z.bg2, 1)},${rgba(z.bg1, 1)})`;
      let dots = '';
      for (let i = 0; i < 7; i++) dots += `<i style="left:${(i * 37 + 9) % 92}%;top:${(i * 53 + 15) % 80}%;width:${2 + (i % 3)}px;height:${2 + (i % 3)}px"></i>`;
      h += `<div class="card${sel ? ' sel' : ''}"><div class="tpv" style="background:${bg}">${dots}</div>
        <div class="cn">${t.name}</div><div class="cd">${t.desc}</div>`;
      h += sel ? '<button class="btn xs wide sel">ВЫБРАН</button>'
        : own ? `<button class="btn xs wide" data-theme="${t.id}">ВЫБРАТЬ</button>`
        : `<button class="btn xs wide buy coinbuy${save.coins < t.cost ? ' poor' : ''}" data-theme="${t.id}">КУПИТЬ · ${t.cost} <i class="coin"></i></button>`;
      h += '</div>';
    }
  }
  const grid = document.getElementById('grid');
  grid.innerHTML = h;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  previews = [...grid.querySelectorAll('canvas.pv')].map((c, i) => {
    c.width = Math.round(72 * dpr); c.height = Math.round(72 * dpr);
    return { g: c.getContext('2d'), b: BALLS.find(x => x.id === c.dataset.ball), dpr, seed: i * 0.13 };
  });
  refreshWallet();
}
function drawPreviews() {
  const t = performance.now() / 1000;
  for (const p of previews) {
    p.g.setTransform(p.dpr, 0, 0, p.dpr, 0, 0);
    p.g.clearRect(0, 0, 72, 72);
    const mood = ((t + p.seed * 7) % 6) < 1.2 ? 'happy' : 'normal';
    drawBall(p.g, 36, 38, 14, p.b, t, Math.cos(t * 1.3 + p.seed) * 120, Math.sin(t * 1.7) * 60, mood, 1, p.seed, 0.5);
  }
}
const shopOpen = () => !document.getElementById('shop').classList.contains('hidden');
function openShop(from, tab) {
  shopFrom = from; shopTab = tab || shopTab;
  document.getElementById(from).classList.add('hidden');
  document.getElementById('shop').classList.remove('hidden');
  document.getElementById('shop').scrollTop = 0;
  renderShop();
}
function closeShop() {
  document.getElementById('shop').classList.add('hidden');
  previews = [];
  if (shopFrom === 'menu') { refreshMenu(); document.getElementById('menu').classList.remove('hidden'); }
  else { document.getElementById('goal2').innerHTML = goalHTML(); refreshWallet(); document.getElementById('over').classList.remove('hidden'); }
}
const nope = () => tone(110, 0.2, 'square', 0.04);
function fanfare() { [0, 2, 4, 7, 9, 12].forEach((k, i) => tone(note(10 + k, 220), 0.6, 'triangle', 0.08, i * 0.06)); }
function buyOrPickBall(id) {
  const b = BALLS.find(x => x.id === id);
  if (!save.balls[id]) {
    if (have(b.cur) < b.cost) { nope(); return; }
    if (b.cur === 'coin') save.coins -= b.cost; else save.dust -= b.cost;
    save.balls[id] = newBallSave();
    fanfare(); toast('НОВЫЙ ШАРИК!', b.name + ' — ' + RARITY[b.rar].name);
  } else tone(note(12), 0.25, 'sine', 0.07);
  save.ball = id; persist(); calcK(); renderShop();
}
function upgradeBall(id, stat) {
  const b = BALLS.find(x => x.id === id), own = save.balls[id];
  if (!own) return;
  const l = own[stat];
  if (l >= 5) return;
  const cost = upCost(b, l);
  if (save.dust < cost) { nope(); return; }
  save.dust -= cost; own[stat] = l + 1; persist(); calcK();
  [0, 4, 7].forEach((k, i) => tone(note(8 + k + l, 220), 0.5, 'triangle', 0.09, i * 0.06));
  renderShop();
}
function buyOrPickTheme(id) {
  const t = THEMES.find(x => x.id === id);
  if (!save.themes.includes(id)) {
    if (save.coins < t.cost) { nope(); return; }
    save.coins -= t.cost; save.themes.push(id);
    fanfare(); toast('НОВЫЙ ФОН!', t.name);
  } else tone(note(12), 0.25, 'sine', 0.07);
  save.theme = id; biomeIdx = 0; persist(); renderShop();
}

// =====================================================================
//  INPUT
// =====================================================================
function press() {
  if (paused) { setPause(false); return; }
  if (shopOpen()) return;
  if (state === 'menu') { startGame(); return; }
  if (state === 'dead') { if (performance.now() - deadAt > 550) startGame(); return; }
  if (state === 'play') { initAudio(); holding = true; }
}
function unpress() { holding = false; }
function setPause(p) {
  if (p && state !== 'play') return;
  paused = p; holding = false;
  document.getElementById('pausep').classList.toggle('hidden', !p);
  if (AC) { if (p) AC.suspend(); else AC.resume(); }
}
// buttons must not keep focus, otherwise Space/Enter would "click" them again
document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('button'); if (b) b.blur(); });
const on = (id, f) => document.getElementById(id).addEventListener('click', f);
on('bPlay', () => startGame());
on('bAgain', () => startGame());
on('bMenu', () => showMenu());
on('bBalls', () => { initAudio(); openShop('menu', 'balls'); });
on('bThemes', () => { initAudio(); openShop('menu', 'themes'); });
on('bShop2', () => { initAudio(); openShop('over', 'balls'); });
on('bBack', closeShop);
on('bPause', () => setPause(true));
on('bResume', () => setPause(false));
on('bQuit', quitRun);
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => { shopTab = t.dataset.tab; renderShop(); tone(note(9), 0.15, 'sine', 0.05); }));
document.getElementById('grid').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.bup) { const [id, st] = b.dataset.bup.split(':'); upgradeBall(id, st); }
  else if (b.dataset.ball) buyOrPickBall(b.dataset.ball);
  else if (b.dataset.theme) buyOrPickTheme(b.dataset.theme);
});
document.getElementById('modes').addEventListener('click', e => {
  const b = e.target.closest('.mode'); if (!b) return;
  initAudio();
  const m = MODES.find(x => x.id === b.dataset.mode);
  if (m.unlockH && best.classic.h < m.unlockH) { nope(); toast('ПОКА ЗАКРЫТО', `Поднимись на ${m.unlockH} м в Классике`); return; }
  save.mode = m.id; persist(); reset(); renderModes();
  tone(note(10), 0.2, 'sine', 0.07);
});
addEventListener('pointerdown', e => {
  const t = e.target;
  if (t.closest && (t.closest('.panel') || t.closest('#bPause'))) return;
  if (e.button === 0 || e.pointerType !== 'mouse') { e.preventDefault(); press(); }
});
addEventListener('pointerup', unpress);
addEventListener('pointercancel', unpress);
addEventListener('blur', () => { holding = false; if (state === 'play') setPause(true); });
addEventListener('contextmenu', e => e.preventDefault());
const HOLD_KEYS = ['Space', 'Enter', 'ArrowUp', 'KeyW'];
addEventListener('keydown', e => {
  if (HOLD_KEYS.includes(e.code)) { e.preventDefault(); if (!e.repeat) press(); }
  else if (e.code === 'KeyM') { initAudio(); setMute(!muted); }
  else if (e.code === 'Escape' && shopOpen()) closeShop();
  else if (e.code === 'KeyP' || e.code === 'Escape') { if (state === 'play') setPause(!paused); }
});
addEventListener('keyup', e => { if (HOLD_KEYS.includes(e.code)) unpress(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') setPause(true); });

// =====================================================================
//  MAIN LOOP (+ automatic quality)
// =====================================================================
setMute(muted);
refillMissions();
reset();
refreshMenu();
if (save.refund > 0) {
  setTimeout(() => toast('ИГРА ОБНОВИЛАСЬ', `Прокачка теперь у каждого шарика своя. Вернули ${save.refund} ✦`), 500);
  save.refund = 0; persist();
}
let last = performance.now(), frameEMA = 16, slowFor = 0, playTime = 0;
function frame(now) {
  const raw = now - last;
  const rdt = Math.max(0, Math.min(0.05, raw / 1000)); last = now;
  if (!paused) {
    // auto-quality: if frames stay slow for 2 s of play, drop one quality level
    if (state === 'play' && raw > 0 && raw < 100 && !document.hidden) {
      playTime += rdt;
      frameEMA = frameEMA * 0.95 + raw * 0.05;
      if (playTime > 3 && frameEMA > 24) slowFor += rdt; else slowFor = 0;
      if (slowFor > 2 && Q > 0) { Q--; slowFor = 0; frameEMA = 16; resize(); }
    }
    if (slowT > 0) slowT = Math.max(0, slowT - rdt);
    const ts = state === 'dying' ? 0.25 : slowT > 0 ? 0.4 : 1;
    const dt = rdt * ts;
    time += dt;
    if (state === 'play') {
      const n = Math.min(6, Math.max(1, Math.ceil(dt / (1 / 180))));
      for (let i = 0; i < n && state === 'play'; i++) step(dt / n);
      cleanup();
    } else {
      updateWorld(dt);
      if (state === 'dying') { dyingT -= rdt; if (dyingT <= 0) finishDeath(); }
      if (state === 'menu') P.y = P.floatY + Math.sin(time * 2.2) * 5;
    }
    updateFx(dt, rdt);
    updateHud();
  }
  render();
  if (previews.length) drawPreviews();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
